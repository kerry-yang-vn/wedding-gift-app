<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>축의금 접수</title>
  <meta name="theme-color" content="#1d2330">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="축의금 접수">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <style>
    :root {
      --bg: #f4f1ea; --card: #fff; --ink: #1d2330; --mute: #6b7280; --line: #e3ded3;
      --groom: #2c5aa0; --groom-bg: #e8effa; --bride: #be3f63; --bride-bg: #fbe9ef;
      --ok: #1f6f4a; --danger: #b42318; --radius: 16px;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; color-scheme: light; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
    }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; border-radius: 12px; }
    button:disabled { opacity: .35; cursor: default; }
    button:focus-visible, input:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
    h2 { margin: 0; font-size: 19px; }

    .warn { background: #fff3cd; color: #664d03; padding: 10px 16px; font-size: 15px; }

    /* 상단 합계 */
    .summary {
      position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: repeat(3, 1fr) repeat(2, 1.3fr);
      gap: 1px; background: #0f131c; color: #fff; padding-top: env(safe-area-inset-top);
    }
    .stat { background: var(--ink); padding: 10px 16px; display: flex; flex-direction: column; min-width: 0; }
    .stat .k { font-size: 13px; opacity: .7; }
    .stat strong { font-size: 26px; line-height: 1.2; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .stat small { font-size: 13px; opacity: .8; }
    .stat.groom { border-top: 4px solid #6f9be0; }
    .stat.bride { border-top: 4px solid #e68aa4; }

    .layout {
      display: grid; gap: 16px; padding: 16px; max-width: 1280px; margin: 0 auto;
      grid-template-columns: minmax(380px, 460px) 1fr; align-items: start;
    }
    .card { background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    #form-card { position: sticky; top: 100px; max-height: calc(100dvh - 116px); overflow-y: auto; }
    #form-card.editing { outline: 3px solid #f59e0b; }

    .field { display: block; margin-bottom: 14px; }
    .field > span, .label { display: block; font-size: 14px; color: var(--mute); margin-bottom: 6px; font-weight: 600; }
    input[type=text], input[type=search] {
      width: 100%; min-height: 56px; padding: 0 14px; font-size: 20px; border: 2px solid var(--line);
      border-radius: 12px; background: #fff; color: inherit;
    }

    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .seg-btn { min-height: 60px; font-size: 20px; font-weight: 800; border: 2px solid var(--line); background: #fff; }
    .seg-btn.groom[aria-pressed=true] { background: var(--groom); border-color: var(--groom); color: #fff; }
    .seg-btn.bride[aria-pressed=true] { background: var(--bride); border-color: var(--bride); color: #fff; }

    .amount-box { background: var(--bg); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; }
    #amount-view { display: block; font-size: 36px; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .formula { color: var(--mute); font-size: 15px; min-height: 1.4em; }
    .amount-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 8px; }
    .amt { min-height: 68px; font-size: 24px; font-weight: 800; background: #fff7e0; border: 2px solid #e8c66a; }
    .amt:active { transform: scale(.97); background: #ffeeb8; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .ghost { min-height: 48px; border: 2px solid var(--line); background: #fff; font-weight: 600; }

    .stepper { display: grid; grid-template-columns: 76px 1fr 76px; gap: 8px; align-items: center; }
    .stepper button { min-height: 64px; font-size: 32px; font-weight: 700; background: #eef2f7; border: 2px solid #d5dce6; }
    .stepper output { text-align: center; font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }

    .msg { min-height: 1.4em; margin: 0 0 8px; color: var(--danger); font-weight: 600; }
    .primary { width: 100%; min-height: 68px; font-size: 22px; font-weight: 800; background: var(--ok); color: #fff; }
    .primary:active { filter: brightness(.9); }
    .link { min-height: 44px; padding: 0 10px; color: var(--groom); font-weight: 700; }

    .tools { display: flex; gap: 8px; }
    .tool { min-height: 44px; padding: 0 14px; border: 2px solid var(--line); background: #fff; font-weight: 700; font-size: 15px; }
    .tool.danger { color: var(--danger); }

    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .filters input { flex: 1 1 180px; min-height: 48px; font-size: 17px; }
    .chips { display: flex; gap: 6px; }
    .chip { min-height: 48px; padding: 0 14px; border: 2px solid var(--line); background: #fff; font-weight: 700; font-size: 15px; }
    .chip[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: #fff; }

    .list { list-style: none; margin: 0; padding: 0; }
    .item { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); }
    .item.editing { background: #fff8e6; }
    .no { width: 36px; color: var(--mute); font-size: 14px; text-align: right; font-variant-numeric: tabular-nums; }
    .pill { padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 800; }
    .pill.groom { background: var(--groom-bg); color: var(--groom); }
    .pill.bride { background: var(--bride-bg); color: var(--bride); }
    .nm { flex: 1 1 140px; min-width: 0; display: flex; flex-direction: column; }
    .nm strong { overflow-wrap: anywhere; }
    .nm small { color: var(--mute); font-size: 13px; }
    .money { font-weight: 800; font-size: 19px; font-variant-numeric: tabular-nums; }
    .meal { color: var(--mute); min-width: 66px; }
    .acts { display: flex; gap: 6px; }
    .mini { min-height: 44px; padding: 0 14px; border: 2px solid var(--line); background: #fff; font-size: 15px; font-weight: 700; }
    .mini.del { color: var(--danger); }
    .empty { color: var(--mute); text-align: center; padding: 28px 0; margin: 0; }

    .toast {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      z-index: 20; display: flex; align-items: center; gap: 14px; max-width: 92vw;
      background: #111827; color: #fff; padding: 12px 18px; border-radius: 14px; font-weight: 600;
      box-shadow: 0 6px 24px rgba(0,0,0,.25);
    }
    .toast[hidden] { display: none; }
    .toast-btn { min-height: 40px; padding: 0 12px; color: #ffd166; font-weight: 800; }

    @media (max-width: 820px) {
      .summary { grid-template-columns: repeat(6, 1fr); }
      .stat.total { grid-column: span 2; padding: 8px 10px; }
      .stat.side { grid-column: span 3; }
      .stat strong { font-size: 20px; }
      .layout { grid-template-columns: 1fr; padding: 12px; }
      #form-card { position: static; max-height: none; overflow: visible; }
    }
  </style>
</head>
<body>
  <div id="storage-warning" class="warn" hidden>
    이 브라우저에서는 데이터를 저장할 수 없습니다. 사생활 보호 모드가 아닌지 확인하고, 수시로 CSV로 내보내 주세요.
  </div>

  <header class="summary" aria-label="합계">
    <div class="stat total"><span class="k">총 인원</span><strong id="sum-count">0명</strong></div>
    <div class="stat total"><span class="k">총 축의금</span><strong id="sum-amount">0원</strong></div>
    <div class="stat total"><span class="k">식권 발급</span><strong id="sum-meals">0장</strong></div>
    <div class="stat side groom"><span class="k">신랑측</span><strong id="groom-amount">0원</strong><small id="groom-detail">0명 · 식권 0장</small></div>
    <div class="stat side bride"><span class="k">신부측</span><strong id="bride-amount">0원</strong><small id="bride-detail">0명 · 식권 0장</small></div>
  </header>

  <main class="layout">
    <section class="card" id="form-card" aria-labelledby="form-title">
      <div class="card-head">
        <h2 id="form-title">접수 입력</h2>
        <button type="button" id="cancel-edit" class="link" hidden>수정 취소</button>
      </div>

      <div class="seg" role="group" aria-label="구분">
        <button type="button" class="seg-btn groom" data-side="groom" aria-pressed="true">신랑측</button>
        <button type="button" class="seg-btn bride" data-side="bride" aria-pressed="false">신부측</button>
      </div>

      <label class="field">
        <span>이름</span>
        <input id="name" type="text" maxlength="30" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="이름 입력">
      </label>

      <div class="field">
        <span class="label">축의금 (버튼을 눌러 더하기)</span>
        <div class="amount-box">
          <strong id="amount-view">0원</strong>
          <div id="amount-formula" class="formula"></div>
        </div>
        <div class="amount-grid" id="amount-grid"></div>
        <div class="row">
          <button type="button" id="undo" class="ghost">마지막 취소</button>
          <button type="button" id="clear" class="ghost">금액 초기화</button>
        </div>
      </div>

      <div class="field">
        <span class="label">식권</span>
        <div class="stepper">
          <button type="button" id="meal-minus" aria-label="식권 한 장 줄이기">−</button>
          <output id="meal-view" aria-live="polite">0장</output>
          <button type="button" id="meal-plus" aria-label="식권 한 장 늘리기">+</button>
        </div>
      </div>

      <p id="form-msg" class="msg" role="alert"></p>
      <button type="button" id="submit" class="primary">등록</button>
    </section>

    <section class="card" id="list-card" aria-labelledby="list-title">
      <div class="card-head">
        <h2 id="list-title">접수 내역</h2>
        <div class="tools">
          <button type="button" id="export" class="tool">CSV 내보내기</button>
          <button type="button" id="reset-all" class="tool danger">전체 삭제</button>
        </div>
      </div>
      <div class="filters">
        <input id="search" type="search" placeholder="이름 검색" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <div class="chips" role="group" aria-label="구분 필터">
          <button type="button" class="chip" data-filter="all" aria-pressed="true">전체</button>
          <button type="button" class="chip" data-filter="groom" aria-pressed="false">신랑측</button>
          <button type="button" class="chip" data-filter="bride" aria-pressed="false">신부측</button>
        </div>
      </div>
      <ol id="list" class="list"></ol>
      <p id="empty" class="empty" hidden></p>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
